  <!-- Central Tech Spine / Transducer Marker -->
  <circle cx="64" cy="14" r="6" fill="#0f766e" />
  <line x1="64" y1="24" x2="64" y2="104" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
