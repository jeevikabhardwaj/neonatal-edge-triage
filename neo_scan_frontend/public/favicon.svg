  <g fill="#0f766e">
    <!-- Upper lobe scan bar -->
    <rect x="20" y="28" width="36" height="10" rx="5" />
    <!-- Mid lobe scan bar -->
    <rect x="12" y="48" width="44" height="10" rx="5" />
    <!-- Lower lobe scan bar -->
    <rect x="16" y="68" width="40" height="10" rx="5" />
    <!-- Base scan bar -->
    <rect x="24" y="88" width="32" height="10" rx="5" />
